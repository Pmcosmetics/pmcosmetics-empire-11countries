name: PM Cosmetics Action Dependency Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  action-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test
        uses: actions/checkout@v4
      - name: Node test
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Runtime test
        run: |
          node --version
          test -f package.json
