name: Notify CI failures

on:
  workflow_run:
    workflows:
      - PM Cosmetics CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to test
        required: true
        default: both
        type: choice
        options:
          - both
          - slack
          - email

permissions:
  actions: read
  contents: read

jobs:
  notify:
    name: Notify team about CI failure or dry run
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_FROM: ${{ secrets.ALERT_FROM }}
      ALERT_TO: ${{ secrets.ALERT_TO }}

    steps:
      - name: Send Slack notification
        if: ${{ env.SLACK_WEBHOOK_URL != '' && (github.event_name == 'workflow_run' || inputs.channel == 'both' || inputs.channel == 'slack') }}
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ github.event_name == 'workflow_dispatch' && '[DRY RUN] PM Cosmetics CI notification' || 'PM Cosmetics CI failed' }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*:warning: ${{ github.event_name == 'workflow_dispatch' && '[DRY RUN] ' || '' }}PM Cosmetics CI notification*\n*Branch:* `${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}`\n*Commit:* `${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}`\n<${{ github.event_name == 'workflow_dispatch' && github.server_url || github.event.workflow_run.html_url }}|View GitHub run>"
                  }
                }
              ]
            }

      - name: Send email notification
        if: ${{ env.SMTP_HOST != '' && env.SMTP_PORT != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.ALERT_FROM != '' && env.ALERT_TO != '' && (github.event_name == 'workflow_run' || inputs.channel == 'both' || inputs.channel == 'email') }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_HOST }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "${{ github.event_name == 'workflow_dispatch' && '[DRY RUN] PM Cosmetics CI notification' || '[CI FAILED] PM Cosmetics CI' }}"
          to: ${{ env.ALERT_TO }}
          from: ${{ env.ALERT_FROM }}
          secure: true
          body: |
            ${{ github.event_name == 'workflow_dispatch' && '[DRY RUN] PM Cosmetics CI notification' || 'PM Cosmetics CI failed.' }}

            Branch: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}
            Commit: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            This is a notification test or CI alert only. Gate remains CLOSED.

      - name: Report unconfigured notification channels
        if: ${{ (github.event_name == 'workflow_dispatch' && ((inputs.channel == 'slack' && env.SLACK_WEBHOOK_URL == '') || (inputs.channel == 'email' && env.SMTP_HOST == '') || (inputs.channel == 'both' && env.SLACK_WEBHOOK_URL == '' && env.SMTP_HOST == ''))) || (github.event_name == 'workflow_run' && env.SLACK_WEBHOOK_URL == '' && env.SMTP_HOST == '') }}
        run: |
          echo "The requested notification channel is not fully configured."
          echo "Configure the repository secrets documented in .github/CI-NOTIFICATIONS.md."
