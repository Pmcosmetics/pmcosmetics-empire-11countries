name: Notify CI failures

on:
  workflow_run:
    workflows:
      - PM Cosmetics CI
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  notify:
    name: Notify team about failed CI
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_FROM: ${{ secrets.ALERT_FROM }}
      ALERT_TO: ${{ secrets.ALERT_TO }}

    steps:
      - name: Send Slack notification
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "PM Cosmetics CI failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*:x: PM Cosmetics CI failed*\n*Workflow:* ${{ github.event.workflow_run.name }}\n*Branch:* `${{ github.event.workflow_run.head_branch }}`\n*Commit:* `${{ github.event.workflow_run.head_sha }}`\n<${{ github.event.workflow_run.html_url }}|View failed run>"
                  }
                }
              ]
            }

      - name: Send email notification
        if: ${{ env.SMTP_HOST != '' && env.SMTP_PORT != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.ALERT_FROM != '' && env.ALERT_TO != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_HOST }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "[CI FAILED] PM Cosmetics CI — ${{ github.event.workflow_run.head_branch }}"
          to: ${{ env.ALERT_TO }}
          from: ${{ env.ALERT_FROM }}
          secure: true
          body: |
            PM Cosmetics CI failed.

            Workflow: ${{ github.event.workflow_run.name }}
            Branch: ${{ github.event.workflow_run.head_branch }}
            Commit: ${{ github.event.workflow_run.head_sha }}
            Run: ${{ github.event.workflow_run.html_url }}

            Gate remains CLOSED; this notification does not deploy or change application data.

      - name: Report unconfigured notification channels
        if: ${{ env.SLACK_WEBHOOK_URL == '' && (env.SMTP_HOST == '' || env.SMTP_PORT == '' || env.SMTP_USERNAME == '' || env.SMTP_PASSWORD == '' || env.ALERT_FROM == '' || env.ALERT_TO == '') }}
        run: |
          echo "CI failed, but no complete Slack or SMTP notification configuration is available."
          echo "Configure the repository secrets documented in .github/CI-NOTIFICATIONS.md."
