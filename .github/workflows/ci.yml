name: PM Cosmetics Hub CI

on:
  push:
    branches:
      - main
      - api-gated-foundation
      - fix/whatsapp-webhook-gated-handler
      - security/workspace-hub-auth-config-hardening
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - name: Runtime
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Verify patched Handlebars test dependency
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE'
          const version = require("handlebars/package.json").version;
          const [major, minor, patch] = version.split(".").map(Number);
          const patched = major > 4 || (major === 4 && (minor > 7 || (minor === 7 && patch >= 10)));
          if (!patched) throw new Error(`Critical Handlebars advisory remains: installed ${version}, required >=4.7.10`);
          console.log(`Handlebars ${version} meets the patched minimum 4.7.10`);
          NODE
      - name: Summarize dependency audit without changing packages
        shell: bash
        run: |
          npm audit --json > /tmp/pm-npm-audit.json || true
          node --input-type=commonjs <<'NODE'
          const fs = require("node:fs");
          let report;
          try {
            report = JSON.parse(fs.readFileSync("/tmp/pm-npm-audit.json", "utf8"));
          } catch {
            console.log("Dependency audit report unavailable or invalid JSON; no dependency changes were made.");
            process.exit(0);
          }
          console.log("Dependency audit counts:", JSON.stringify(report.metadata?.vulnerabilities || {}));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            const advisories = (item.via || [])
              .filter((entry) => typeof entry === "object")
              .map((entry) => `${entry.title || "advisory"} (${entry.url || entry.source || "URL unavailable"})`);
            console.log(
              `[${item.severity}] ${name}@${item.range}; direct=${item.isDirect}; fixAvailable=${JSON.stringify(item.fixAvailable)}; advisories=${advisories.join(" | ") || "see npm audit metadata"}`
            );
          }
          NODE
      - name: Build
        run: npm run build
      - name: Validate
        run: npm run validate
      - name: Test
        run: npm test
      - name: Verify build evidence
        shell: bash
        run: |
          test -s dist/build-manifest.json
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("dist/build-manifest.json","utf8")); if (m.gate !== "CLOSED") throw new Error("Build gate is not CLOSED"); if (m.productsApi !== "503 DATA_INTAKE_LOCKED") throw new Error("Products API lock evidence is missing"); console.log("Build evidence verified:", JSON.stringify(m));'
      - name: Upload CI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pmcosmetics-ci-evidence
          path: dist/build-manifest.json
          if-no-files-found: error
          retention-days: 14
