name: PM Cosmetics Hub CI

on:
  push:
    branches:
      - main
      - api-gated-foundation
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - name: Runtime
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Validate
        run: npm run validate
      - name: Test
        run: npm test
