name: Validate PM Cosmetics Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
      - name: Runtime
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Validate all contracts
        run: npm run validate
