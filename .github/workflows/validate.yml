name: Validate PM Cosmetics Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without marketplace actions
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" "https://github.com/${GITHUB_REPOSITORY}.git" .
      - name: Runtime
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Validate all contracts
        run: npm run validate
